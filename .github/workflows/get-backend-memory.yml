name: Get backend memory usage
jobs:
  get-memory-usage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        memory-json-name:
        - memory-base.json
        - memory-head.json
        include:
        - memory-json-name: memory-base.json
          ref: ${{ github.base_ref }}
        - memory-json-name: memory-head.json
          ref: refs/pull/${{ github.event.number }}/merge
    services:
      postgres:
        image: postgres:18
        ports:
        - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:7
        ports:
        - 56312:6379
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        ref: ${{ matrix.ref }}
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.4.0
    - name: Use Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm i --frozen-lockfile
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config/default.yml
    - name: Compile Configure
      run: pnpm compile-config
    - name: Build
      run: pnpm build
    - name: Run migrations
      run: pnpm --filter backend migrate
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG producer: pre-measure-memory"
        MATRIX_REF=${{ toJSON(matrix.ref) }}
        MEM_JSON=${{ toJSON(matrix.memory-json-name) }}
        printf 'matrix.ref=%s\n' "$MATRIX_REF"
        printf 'matrix.memory-json-name=%s\n' "$MEM_JSON"
        git rev-parse HEAD 2>/dev/null || true
        git log -1 --oneline 2>/dev/null || true
        ls -la packages/backend/scripts/measure-memory.mjs 2>/dev/null || echo 'measure-memory.mjs not found'
      continue-on-error: true
    - name: Measure memory usage
      run: |
        # Start the server and measure memory usage
        node packages/backend/scripts/measure-memory.mjs > ${{ matrix.memory-json-name }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG producer: pre-upload (attacker-controlled artifact content)"
        MEM_JSON=${{ toJSON(matrix.memory-json-name) }}
        printf 'artifact file: %s\n' "$MEM_JSON"
        if [ -f "$MEM_JSON" ]; then
          head -c 2000 "$MEM_JSON" || true
          echo
        else
          echo "artifact file not found"
        fi
      continue-on-error: true
    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: memory-artifact-${{ matrix.memory-json-name }}
        path: ${{ matrix.memory-json-name }}
  save-pr-number:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Save PR number
      env:
        PR_NUMBER: ${{ github.event.number }}
      run: |
        echo "$PR_NUMBER" > ./pr_number
    - uses: actions/upload-artifact@v6
      with:
        name: memory-artifact-pr-number
        path: pr_number
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    branches:
    - master
    - develop
    paths:
    - packages/backend/**
    - packages/misskey-js/**
    - .github/workflows/get-backend-memory.yml
